# 小食叙记 Nginx 站点配置（域名：xiaoshixuji.xyz）
# 证书走 certbot/Let's Encrypt 标准路径，无需手动改证书路径。
#
# 部署顺序建议：
#   1) 先放本文件（此时 443 引用的证书还没生成，nginx -t 会报证书不存在，
#      可临时先只启用 80 段，或直接跳到第 2 步用 certbot 自动完成）。
#   2) 最省事：先只启用一个纯 80 的 server（见文件尾部注释），然后
#      sudo certbot --nginx -d xiaoshixuji.xyz   —— certbot 会自动申请证书并写 443。
#   3) 手动方案：sudo certbot certonly --nginx -d xiaoshixuji.xyz 拿证书后启用本文件。

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name xiaoshixuji.xyz www.xiaoshixuji.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name xiaoshixuji.xyz www.xiaoshixuji.xyz;

    # Let's Encrypt 证书（certbot 自动生成，自动续期）
    ssl_certificate     /etc/letsencrypt/live/xiaoshixuji.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaoshixuji.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 上传大小限制：社区最多 9 图 × 单张 5MB
    client_max_body_size 50m;

    # 静态文件直接由 Nginx 提供，减轻 Python 压力、加快图片加载
    location /static/ {
        alias /opt/bjtu-meal/static/;
        expires 7d;
    }

    # 其余请求反向代理到 gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

